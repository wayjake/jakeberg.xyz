<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { background: var(--linen); }

  .copy {
    position: absolute;
    left: 72px; top: 64px; bottom: 96px;
    width: 450px;
    display: flex; flex-direction: column;
  }
  .copy .eyebrow { margin-top: auto; margin-bottom: 18px; }
  .copy h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 62px;
    line-height: 0.98;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .copy .sub {
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.15;
    color: var(--stone-700);
    margin-top: 18px;
    margin-bottom: auto;
  }
  .shelf { position: absolute; left: 72px; width: 450px; top: 564px; }
  .domain { position: absolute; left: 72px; top: 584px; }

  /* Sunday's greybox behind Wednesday's console, both real screenshots */
  .shot {
    position: absolute;
    overflow: hidden;
    border-radius: 6px;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    box-shadow:
      0 0 0 1px rgb(28 25 23 / 0.1),
      0 2px 4px rgb(68 64 60 / 0.08),
      0 30px 60px -20px rgb(68 64 60 / 0.5);
  }
  .greybox {
    left: 572px; top: 58px;
    width: 340px; height: 191px;
    transform: rotate(-3deg);
    background-image: url(assets/spacevolution-greybox.png);
  }
  .console {
    left: 600px; top: 196px;
    width: 560px; height: 315px;
    transform: rotate(1.5deg);
    background-image: url(assets/spacevolution-console.png);
  }
  .tag {
    position: absolute;
    font: 500 11px var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 8px;
    border-radius: 3px;
  }
  .greybox .tag { left: 10px; top: 10px; background: rgb(28 25 23 / 0.75); color: #eeeae3; }
  .console .tag { right: 10px; bottom: 10px; background: rgb(0 0 0 / 0.7); color: #f0a040; }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark">JB<span>.</span></div>
    <div class="eyebrow">Spacevolution · devlog</div>
    <h1>A Blender spaceship, baked into the browser</h1>
    <div class="sub">From a prompt file to a playable ship in under 11 hours.</div>
  </div>

  <div class="shot greybox"><span class="tag">Greybox · Sunday</span></div>
  <div class="shot console"><span class="tag">In the browser · Wednesday</span></div>

  <div class="shelf"><div class="rule"></div></div>
  <div class="domain">jakeberg.xyz/blog</div>
</body>
</html>
