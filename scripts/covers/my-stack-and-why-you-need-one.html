<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { background: var(--linen); }

  .copy {
    position: absolute;
    left: 72px; top: 64px; bottom: 96px;
    width: 470px;
    display: flex; flex-direction: column;
  }
  .copy .eyebrow { margin-top: auto; margin-bottom: 18px; }
  .copy h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 118px;
    line-height: 0.9;
    letter-spacing: -0.01em;
  }
  .copy .sub {
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: 50px;
    line-height: 1.05;
    color: var(--stone-700);
    margin-top: 14px;
  }
  .copy .sub { margin-bottom: auto; }
  .domain { position: absolute; left: 72px; top: 584px; }

  /* The stack: hardcover spines, one per layer, foundation at the bottom */
  .shelf {
    position: absolute;
    left: 72px; right: 72px; top: 564px;
  }
  .shelf .rule { border-color: var(--stone-900); }
  .shadow {
    position: absolute;
    left: 626px; width: 500px; top: 548px; height: 26px;
    background: radial-gradient(closest-side, rgb(28 25 23 / 0.35), transparent);
    filter: blur(4px);
  }
  .book {
    position: absolute;
    display: flex; align-items: center;
    border-radius: 5px 3px 3px 5px;
    padding: 0 26px 0 30px;
    box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.18), inset 0 -3px 0 rgb(0 0 0 / 0.18), 0 1px 0 rgb(0 0 0 / 0.12);
  }
  .book::before, .book::after {
    /* gilt bands near each end of the spine */
    content: "";
    position: absolute; top: 8px; bottom: 8px;
    width: 7px;
    border-left: 1.5px solid var(--band);
    border-right: 1.5px solid var(--band);
    opacity: 0.8;
  }
  .book::before { left: 12px; }
  .book::after { right: 12px; }
  .book .t {
    font-family: var(--display);
    font-weight: 600;
    font-size: 29px;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .book .v {
    margin-left: auto;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  .sheen {
    background-image: linear-gradient(180deg, rgb(255 255 255 / 0.10), transparent 35%, rgb(0 0 0 / 0.14));
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark">JB<span>.</span></div>
    <div class="eyebrow">Architecture</div>
    <h1>My Stack</h1>
    <div class="sub">and why you need one</div>
  </div>

  <div class="shadow"></div>

  <!-- top to bottom -->
  <div class="book sheen" style="left:676px; width:404px; top:216px; height:62px; background-color:#78716c; color:var(--paper); --band:#e9dcc6; transform: rotate(-3deg);">
    <span class="t">React Router</span><span class="v" style="text-transform:none; letter-spacing:0.08em">v7</span>
  </div>
  <div class="book sheen" style="left:648px; width:420px; top:286px; height:60px; background-color:var(--paper); color:var(--stone-900); --band:var(--wine); box-shadow: inset 0 0 0 1px rgb(28 25 23 / 0.12), 0 1px 0 rgb(0 0 0 / 0.1);">
    <span class="t">UploadThing</span><span class="v">Files</span>
  </div>
  <div class="book sheen" style="left:628px; width:470px; top:346px; height:72px; background-color:var(--wine); color:var(--paper); --band:#e8c9a0;">
    <span class="t">Drizzle ORM</span><span class="v">Types</span>
  </div>
  <div class="book sheen" style="left:660px; width:446px; top:418px; height:66px; background-color:#d8cfbf; color:var(--stone-900); --band:var(--stone-700);">
    <span class="t">Turso</span><span class="v">libSQL</span>
  </div>
  <div class="book sheen" style="left:636px; width:486px; top:484px; height:80px; background-color:var(--stone-900); color:var(--paper); --band:#c9a86a;">
    <span class="t">Vercel</span><span class="v">Deploy</span>
  </div>

  <div class="shelf"><div class="rule"></div></div>
  <div class="domain">jakeberg.xyz/blog</div>
</body>
</html>
