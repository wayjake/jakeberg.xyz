<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #f4f0e8; }

  .copy {
    position: absolute;
    left: 72px; top: 64px; bottom: 96px;
    width: 450px;
    display: flex; flex-direction: column;
  }
  .copy .eyebrow { margin-top: auto; margin-bottom: 18px; }
  .copy h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 62px;
    line-height: 0.98;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .copy .sub {
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.15;
    color: var(--stone-700);
    margin-top: 18px;
    margin-bottom: auto;
  }
  .shelf { position: absolute; left: 72px; width: 450px; top: 564px; }
  .domain { position: absolute; left: 72px; top: 584px; }

    /* Pen-and-ink illustration from the post's image prompt; edges feathered into the page */
  .art {
    position: absolute;
    right: 24px; top: 15px;
    width: 600px; height: 600px;
    background: url(assets/gates-2.png) center / cover no-repeat;
    -webkit-mask-image: radial-gradient(closest-side, #000 82%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 82%, transparent 100%);
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark">JB<span>.</span></div>
    <div class="eyebrow">On the Keeping of Gates · Part 2</div>
    <h1>The Wall Around the Phone</h1>
    <div class="sub">Android, the carriers, and what a phone ought to be.</div>
  </div>

  <div class="art"></div>

  <div class="shelf"><div class="rule"></div></div>
  <div class="domain">jakeberg.xyz/blog</div>
</body>
</html>
