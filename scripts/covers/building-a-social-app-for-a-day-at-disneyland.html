<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { background: var(--linen); }

  .copy {
    position: absolute;
    left: 72px; top: 64px; bottom: 96px;
    width: 500px;
    display: flex; flex-direction: column;
  }
  .copy .eyebrow { margin-top: auto; margin-bottom: 18px; }
  .copy h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 70px;
    line-height: 0.98;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .copy .sub {
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: 36px;
    line-height: 1.15;
    color: var(--stone-700);
    margin-top: 18px;
    margin-bottom: auto;
  }
  .shelf { position: absolute; left: 72px; width: 500px; top: 564px; }
  .domain { position: absolute; left: 72px; top: 584px; }

  /* The real screenshot, cropped below the phone's status bar, running off the bottom edge */
  .shot {
    position: absolute;
    left: 636px; top: 44px;
    width: 522px; height: 700px;
    border-radius: 30px;
    overflow: hidden;
    transform: rotate(3deg);
    transform-origin: top left;
    background: #fff url(assets/dubsado.png) no-repeat;
    background-size: 522px auto;
    background-position: 0 -14px;
    box-shadow:
      0 0 0 1px rgb(28 25 23 / 0.08),
      0 2px 4px rgb(68 64 60 / 0.08),
      0 30px 60px -20px rgb(68 64 60 / 0.45);
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark">JB<span>.</span></div>
    <div class="eyebrow">Dubsado team day · Disneyland</div>
    <h1>A social app for one day at Disneyland</h1>
    <div class="sub">Two days to build.<br>33 cents of Vercel.</div>
  </div>

  <div class="shot"></div>

  <div class="shelf"><div class="rule"></div></div>
  <div class="domain">jakeberg.xyz/blog</div>
</body>
</html>
